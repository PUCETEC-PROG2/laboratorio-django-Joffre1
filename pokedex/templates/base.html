{% load static %}
<html>
  <head>
    <title>Pokedex</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <div class="bg-primary text-white p-4 text-center">
        <img src="{% static 'logo.png' %}" alt="Pokedex Logo" class="img-fluid" />
      </div>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'pokedex:index' %}">Pokemons</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'pokedex:trainer_list' %}">Entrenadores</a>
              </li>
              {% if not user.is_authenticated %}
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'pokedex:login' %}">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar sesión
                  </a>
                </li>
              {% else %}
                <form action="{% url 'logout' %}" method="post" class="form-inline">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-outline-danger my-2 my-sm-0">
                    <i class="fas fa-sign-out-alt"></i>
                    Salir
                  </button>
                </form>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>
      {% block content %}

      {% endblock %}
    </div>
  </body>
</html>
