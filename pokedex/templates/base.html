{% load static %}

<html>
  <head>
    <title>PokéSync DB</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  
    <style>

body{
    background:#f5f6fa;
}

.pokemon-card{
    border:none;
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.pokemon-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.pokemon-img{
    height:220px;
    object-fit:contain;
    background:#fafafa;
    padding:15px;
}

.badge-type{
    font-size:15px;
    padding:8px 14px;
    border-radius:20px;
}

.action-btn{

    width:42px;

    height:42px;

    border-radius:50%;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:0;

    margin:3px;

}

.action-btn i{

    font-size:16px;

    line-height:1;

}

.database-card{
    border:none;
    border-radius:18px;
    color:white;
    padding:20px;
    margin-bottom:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card-body{

    min-height:210px;

}

.card-footer{

    background:white;

    border-top:none;

}

.navbar{

    box-shadow:0 4px 15px rgba(0,0,0,.2);

}

.navbar-brand{

    letter-spacing:1px;

}

.btn{

    transition:.25s;

}

.btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(0,0,0,.18);

}

.nav-link{

    transition:.25s;

}

.nav-link:hover{

    transform:translateY(-2px);

}

</style>

  </head>
  <body>
    <div class="container">
      <div class="bg-primary text-white p-4 text-center rounded shadow mb-3">

    <img
        src="{% static 'logo.png' %}"
        alt="Pokedex Logo"
        class="img-fluid"
        style="max-height:140px;">

    <h2 class="mt-3 fw-bold">

        <i class="fa-solid fa-database me-2"></i>

        PokéSync DB

    </h2>

    <p class="mb-0">

        Sincronización entre PostgreSQL y MongoDB

    </p>

</div>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded shadow mb-4">
        <div class="container-fluid">
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'pokedex:index' %}">

    <i class="fa-solid fa-dragon me-1"></i>

    Pokémons

</a>
            
              </li>
              {% if not user.is_authenticated %}
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'pokedex:login' %}">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar sesión
                  </a>
                </li>
              {% else %}
                <form action="{% url 'logout' %}" method="post" class="form-inline">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger rounded-pill" my-2 my-sm-0">
                    <i class="fas fa-sign-out-alt"></i>
                    Salir
                  </button>
                </form>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>
      {% block content %}

      {% endblock %}
    </div>
  </body>
