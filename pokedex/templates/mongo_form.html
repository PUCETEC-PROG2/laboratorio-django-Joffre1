{% extends "base.html" %}

{% block content %}

<h2>

{% if edit %}

Editar Pokémon (MongoDB)

{% else %}

Agregar Pokémon (MongoDB)

{% endif %}

</h2>

<br>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <div class="mb-3">

        <label>Nombre</label>

        <input
    class="form-control"
    name="name"
    value="{{ pokemon.name|default:'' }}">

    </div>

    <div class="mb-3">

        <label>Tipo</label>

        <input
    class="form-control"
    name="type"
    value="{{ pokemon.type|default:'' }}">

    </div>

    <div class="mb-3">

        <label>Peso</label>

        <input
    class="form-control"
    type="number"
    name="weight"
    value="{{ pokemon.weight|default:'' }}">

    </div>

    <div class="mb-3">

        <label>Altura</label>

        <input
    class="form-control"
    type="number"
    name="height"
    value="{{ pokemon.height|default:'' }}">

    </div>

    {% if edit and pokemon.picture %}

        <div class="mb-3">

            <img
                src="/media/{{ pokemon.picture }}"
                style="max-width:200px;">

        </div>

    {% endif %}

    <div class="mb-3">

        <label>Imagen</label>

        <input
            type="file"
            class="form-control"
            name="picture">

    </div>

    <div class="form-check mb-3">

    <input
    class="form-check-input"
    type="checkbox"
    id="favorite"
    name="favorite"
    {% if pokemon.favorite %}checked{% endif %}>

    <label class="form-check-label" for="favorite">

        Pokémon favorito

    </label>

</div>

<div class="mb-3">

    <label class="form-label">

        Comentario

    </label>

    <textarea
    class="form-control"
    rows="4"
    name="comment">{{ pokemon.comment|default:'' }}</textarea>

</div>

<div class="mb-3">

    <label class="form-label">

        Etiquetas

    </label>

   <input
    class="form-control"
    type="text"
    name="tags"
    value="{% if pokemon.tags %}{{ pokemon.tags|join:', ' }}{% endif %}">

    <small class="text-muted">

        Separe las etiquetas usando comas.

    </small>

</div>

    <button class="btn btn-success">

    <i class="fa-solid fa-floppy-disk me-1"></i>

    {% if pokemon %}

        Guardar cambios

    {% else %}

        Guardar Pokémon

    {% endif %}

</button>

    <a
        href="{% url 'pokedex:mongo_index' %}"
        class="btn btn-danger">

        Cancelar

    </a>

</form>

{% endblock %}
