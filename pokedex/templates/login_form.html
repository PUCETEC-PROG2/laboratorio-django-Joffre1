{% extends "base.html" %}

{% block title %} Formulario de Pokemon {% endblock title %}
{% block content %}
        <form method="post">
                {% csrf_token %}
                
                <div class= "row.d-flex.justify-contend-center">
                        <div class="col-6">
                                <br>
                                <div>
                                        <label for="username">Usuario:</label>
                                        <input type="text" name="username" id="username" class="form-control">
                                </div>
                                <br>
                                <div>
                                        <label for="password">Contraseña:</label>
                                        <input type="password" name="password" id="password" class="form-control">
                                </div> 
                        <br>
                        <button type="submit" class = "btn btn-warning">Ingresar</button>
                        <a href="{% url 'pokedex:index' %}" class="btn btn-primary">Regresar</a>
                </div>

        </form>
{% endblock content %}
